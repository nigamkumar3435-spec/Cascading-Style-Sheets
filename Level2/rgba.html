<!DOCTYPE html>
<html lang="en">
<head>
    <title>RGB Alpha</title>
</head>
<body>
    <!--1.RGBA is RGB's extension ,includes alpha for opacity control(0-1 range).
    2.Transparency Control: Facilitates the adjustment of transparency levels in colors.
    3.Visual Effects: Enables the creation of visual effects like shadows and overlays.
    4.Layering: Assists in layering elements with varying degrees of visibility.-->
    <div style="background-color: rgba(255,0,0,0.0);">First</div>
    <div style="background-color: rgba(0,255,0,0.1);">Second</div>
    <div style="background-color: rgba(255,0,0,0.2);">Third</div>
    <div style="background-color: rgba(0,255,0,0.3);">First</div>
    <div style="background-color: rgba(255,0,0,0.4);">Second</div>
    <div style="background-color: rgba(0,255,0,0.5);">Third</div>
    <div style="background-color: rgba(255,0,0,0.6);">First</div>
    <div style="background-color: rgba(0,255,0,0.7);">Second</div>
    <div style="background-color: rgba(255,0,0,0.8);">Third</div>
    <div style="background-color: rgba(0,255,0,0.9 );">Second</div>
    <div style="background-color: rgba(255,0,0,1);">Third</div>
</body>
</html>
