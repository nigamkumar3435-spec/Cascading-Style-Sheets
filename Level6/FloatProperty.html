<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FloatProperty</title>
    <style>
        .container{
            height: 190px;
            width: 400px;
            background-color: cadetblue;
            margin: 5px;
            border: 2px solid black;
        }
        #Box1{
            height: 50px;
            width: 50px;
            background-color: cornflowerblue;
            margin: 2px;
            border: 2px solid black;
            float: right;
        }
        #Box2{
            height: 50px;
            width: 50px;
            background-color: rgb(143, 154, 173);
            margin: 2px;
            border: 2px solid black;
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="Box1">Box1</div>
        <div id="Box2">Box2</div>
    </div>
</body>
</html>
