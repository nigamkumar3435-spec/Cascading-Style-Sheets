<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Property: z index</title>
    <style>
        *{
            margin: 0%;padding: 0%;
        }
        .container{
            position: relative;
        }
        .box1, .box2{
            position: absolute;
            border: 3px solid black;
            width: 100px;
            height: 100px;
            text-align: center;
            font-size: 25px;
        }
        .box1{
            background-color: red;
            left: 20px;
            top: 60px;
            z-index: 2;
        }
        .box2{
            background-color: aqua;
            left: 50px;
            top: 20px;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="box1">Box1</div>
    <div class="box2">Box2</div>
</body>
</html>
