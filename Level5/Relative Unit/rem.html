<!-- To make responsive design, we use (Relative Units). -->

<!-- REM : Relative Sizing- Facilitates dynamic sizing relative to root element. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtive Unit : REM</title>
    <style>
        *{
            margin: 0%;
            padding: 0%;
            font-size: 10px;
        }
        #first{
            background-color: cornflowerblue;
            height: 200px;
            width: 300px;
            font-size: 20px;
        }
        #second{
            background-color: bisque;
            height: 50%;
            width: 40%;
            font-size: 0.5rem;
        }
    </style>
</head>
<body>
    Body Text
    <div id="first">First 
        <div id="second">Second</div>
    </div>
</body>
</html>
