<!-- To make responsive design, we use (Relative Units). -->

<!-- EM : Relative Unit- Sized relative to the parent element's font size. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtive Unit: EM</title>
    <style>
        #first{
            background-color: bisque;
            height: 100px;
            width: 300px;
            font-size: 20px;
        }
        #second{
            background-color: blueviolet;
            font-size: 1.5em;
            height: 50%;
            width: 40%;
        }
    </style>
</head>
<body>
    <div id="first">First Div 
        <div id="second">Second Div</div>
    </div>
</body>
</html>
