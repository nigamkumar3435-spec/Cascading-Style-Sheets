<!DOCTYPE html>
<html lang="en">
<head>
    <title>Color Property</title>
    <style>
        h1{
            color: greenyellow;
        }
        p{
            color: aquamarine;
        }
        #first{
            color: blue;
        }
        .box{
            color: rgb(213, 13, 67);
        }
    </style>
</head>
<body>
    <h1>This is Heading1</h1>
    <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Consectetur, quas!</p>

    <h2 id="first">This is the second heading .</h2>
    <p class="box">This is box1.</p>
    <p class="box">This is box2.</p>
</body>
</html>
