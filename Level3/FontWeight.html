<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Weight Property</title>
    <style>
        #para1{font-weight: bolder;}
        #para2{font-weight: lighter;}
        #para3{font-weight: bold;}
        #para4{font-weight: normal;}
        #para5{font-weight:400;}
        #para6{font-weight: 100;}
    </style>
</head>
<body>
    <p id="para1">Lorem ipsum dolor sit amet.</p>
    <p id="para2">Lorem ipsum dolor sit amet.</p>
    <p id="para3">Lorem ipsum dolor sit amet.</p>
    <p id="para4">Lorem ipsum dolor sit amet.</p>
    <p id="para5">Lorem ipsum dolor sit amet.</p>
    <p id="para6">Lorem ipsum dolor sit amet.</p>
</body>
</html>
