<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line Height Property</title>
    <style>
        #para1{line-height:10px;}
        #para2{line-height: 30px;}
        #para3{line-height: 5px;}
    </style>
</head>
<body>
    <p id="para1">Lorem ipsum dolor sit amet consectetur adipisicing elit. Porro, quam.</p>
    <hr>
    <p id="para2">Lorem ipsum dolor sit amet consectetur adipisicing elit. Sequi, cum.</p>
    <hr>
    <p id="para3">Lorem ipsum dolor sit amet consectetur adipisicing elit. Atque, ipsam?</p>
</body>
</html>
<!--hr is used to give line between two spaces.
    br is used to break the current line to next line.-->
