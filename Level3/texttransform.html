<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Transform Property</title>
    <style>
        #head1{text-transform: capitalize;}
        #head2{text-transform: lowercase;}
        #head3{text-transform: uppercase;}
        #head4{text-transform: inherit;}
        #head5{text-transform: capitalize;}
    </style>
</head>
<body>
    <h1 id="head1">This is first head.</h1>
    <h2 id="head2">This is second Head.</h2>
    <h3 id="head3">This is Third head.</h3>
    <h4 id="head4">This is FOurth Head.</h4>
    <h5 id="head5">This is fiFth heaD.</h5>
</body>
</html>
