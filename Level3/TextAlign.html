<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Align Property</title>
    <style>
        #box1{
            height: 167px;
            width: 234px;
            text-align: center;
            background-color: chartreuse;
        }
        #box2{
            height: 167px;
            width: 234px;
            text-align: right;
            background-color: darksalmon;
        }
        #box3{
            height: 167px;
            width: 234px;
           
            background-color: darkcyan;
        }
    </style>
</head>
<body>
    <div id="box1" >Beat Box1</div>
    <div id="box2">Beat Box2</div>
    <div id="box3">Beat Box3</div>
</body>
</html>
