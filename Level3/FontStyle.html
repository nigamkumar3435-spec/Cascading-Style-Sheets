<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font-Style Property</title>
    <style>
        #para1{font-style: italic;}
        #para2{font-style: oblique;}
        #para3{font-style: normal;}
        
    </style>
</head>
<body>
    <p id="para1">Lorem ipsum dolor sit amet.</p>
    <p id="para2">Lorem ipsum dolor sit amet.</p>
    <p id="para3">Lorem ipsum dolor sit amet.</p> 
</body>
</html>
