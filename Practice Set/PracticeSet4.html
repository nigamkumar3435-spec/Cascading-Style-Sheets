<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Set 4</title>
    <style>
        *{
            margin: 0%;
            padding: 0%;
        }
        .box{
            height: 100px;
            width: 100px;
            background-color: blueviolet;
            margin: 20px;
            padding: 20px;
            border-radius: 10px;
        }
        #click{
            height: 50px;
            width: 50px;
            padding: 10px 2px 15px 2px;
            margin: 100px;
            border-radius: 50px;
            border: 2px dotted red;
        }
    </style>
</head>
<body>
    <div class="box" style="box-sizing: border-box;">Box1</div>
    <div class="box" style="box-sizing: content-box;">Box2</div>
    <button id="click">Click</button>
</body>
</html>
